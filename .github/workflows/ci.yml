# Type-checks and tests every push and pull request. (On Render, set Auto-Deploy to
# "After CI checks pass" so a failing build never reaches the live game.)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # the stats tests use its built-in SQLite
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
